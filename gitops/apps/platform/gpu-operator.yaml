apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    chart: gpu-operator
    targetRevision: v26.7.0
    helm:
      releaseName: gpu-operator
      valuesObject:
        driver:
          enabled: false
        toolkit:
          enabled: false
        devicePlugin:
          enabled: true
        gfd:
          enabled: true
        dcgmExporter:
          enabled: true
          serviceMonitor:
            enabled: true
        migManager:
          enabled: false
        operator:
          defaultRuntime: containerd
        daemonsets:
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
        node-feature-discovery:
          worker:
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
