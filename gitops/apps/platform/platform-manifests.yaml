apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: platform-manifests
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Badmamane/k8s-ministral-8b-platform.git
        targetRevision: master
        path: gitops/charts/platform-manifests
        helm:
          releaseName: platform-manifests
          valuesObject:
            region: '{{ .metadata.annotations.region }}'
            environment: '{{ index .metadata.labels "environment" }}'
            storageKmsKeyArn: '{{ .metadata.annotations.storage_kms_key_arn }}'
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
