apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: aws-load-balancer-controller
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://aws.github.io/eks-charts
        chart: aws-load-balancer-controller
        targetRevision: 3.5.0
        helm:
          releaseName: aws-load-balancer-controller
          valuesObject:
            clusterName: '{{ .metadata.annotations.cluster_name }}'
            region: '{{ .metadata.annotations.region }}'
            vpcId: '{{ .metadata.annotations.vpc_id }}'
            replicaCount: 1
            nodeSelector:
              workload: platform
            serviceAccount:
              create: true
              name: aws-load-balancer-controller
            defaultTags:
              Project: k8s-ministral-8b
              Environment: '{{ index .metadata.labels "environment" }}'
              ManagedBy: aws-load-balancer-controller
            enableServiceMutatorWebhook: false
            serviceMonitor:
              enabled: true
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
