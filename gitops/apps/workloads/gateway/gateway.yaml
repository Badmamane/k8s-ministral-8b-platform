apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: gateway
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Badmamane/k8s-ministral-8b-platform.git
        targetRevision: master
        path: gitops/charts/gateway
        helm:
          releaseName: gateway
          valuesObject:
            ingressSecurityGroupId: '{{ .metadata.annotations.ingress_security_group_id }}'
            secretsPrefix: '{{ .metadata.annotations.secrets_prefix }}'
      destination:
        server: '{{ .server }}'
        namespace: gateway
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # ------ Client-side apply: the Envoy Gateway and Agent Router webhooks mutate these
        # ------ objects at admission, which keeps a server-side dry run permanently OutOfSync.
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
