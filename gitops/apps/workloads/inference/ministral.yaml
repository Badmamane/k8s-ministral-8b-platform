apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ministral
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Badmamane/k8s-ministral-8b-platform.git
    targetRevision: master
    path: gitops/charts/ministral
    helm:
      releaseName: ministral
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
