apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: observability-manifests
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Badmamane/k8s-ministral-8b-platform.git
        targetRevision: master
        path: gitops/charts/observability-manifests
        helm:
          releaseName: observability-manifests
          valuesObject:
            secretsPrefix: '{{ .metadata.annotations.secrets_prefix }}'
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
