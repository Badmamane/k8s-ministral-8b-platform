# ------ One JSON field per client id in Secrets Manager becomes one key in the Secret,
# ------ the format Envoy Gateway's apiKeyAuth expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-api-keys
  namespace: gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: gateway-api-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/gateway-api-keys" .Values.secretsPrefix | quote }}
