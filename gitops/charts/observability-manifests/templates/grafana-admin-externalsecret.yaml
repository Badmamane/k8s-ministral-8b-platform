apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ printf "%s/grafana-admin" .Values.secretsPrefix | quote }}
        property: username
    - secretKey: admin-password
      remoteRef:
        key: {{ printf "%s/grafana-admin" .Values.secretsPrefix | quote }}
        property: password
