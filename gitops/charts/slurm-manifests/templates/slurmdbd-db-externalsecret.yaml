apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slurmdbd-db
  namespace: slurm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: slurmdbd-db
    creationPolicy: Owner
    # ------ slurmdbd.conf syntax: '#' starts a comment and '\' escapes, so both are
    # ------ escaped here; Slurm strips the escapes when it reads StoragePass.
    template:
      engineVersion: v2
      data:
        {{- /* backtick raw string: emitted verbatim for External Secrets, not rendered by Helm */}}
        password: {{ `{{ .password | replace "\\" "\\\\" | replace "#" "\\#" }}` | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.rdsSecretArn | quote }}
        property: password
