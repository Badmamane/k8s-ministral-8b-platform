apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-smi
          image: public.ecr.aws/docker/library/debian:bookworm-slim
          command: ["nvidia-smi"]
          resources:
            limits:
              nvidia.com/gpu: 1
